# Nested Docker (vfs) often cannot route container-to-container on the compose
# bridge. Java processes reach Postgres/Redis/Auth through published host ports
# via host.docker.internal (Linux extra_hosts host-gateway).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pangya}
      POSTGRES_USER: ${POSTGRES_USER:-pangya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pangya-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pangya} -d ${POSTGRES_DB:-pangya}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "0.0.0.0:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      args:
        MODULE: server-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-pangya}
      DATABASE_USER: ${POSTGRES_USER:-pangya}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
      REDIS_URI: redis://host.docker.internal:6379
      PANGYA_MIGRATE_ON_START: "true"
      PANGYA_IP: ${PANGYA_IP:-127.0.0.1}
    ports:
      - "0.0.0.0:7777:7777"
      - "0.0.0.0:9077:9077"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9077/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  login:
    build:
      context: .
      args:
        MODULE: server-login
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-pangya}
      DATABASE_USER: ${POSTGRES_USER:-pangya}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
      REDIS_URI: redis://host.docker.internal:6379
      PANGYA_AUTH_HOST: host.docker.internal
      PANGYA_IP: ${PANGYA_IP:-127.0.0.1}
    ports:
      - "0.0.0.0:10203:10203"
      - "0.0.0.0:9103:9103"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  game:
    build:
      context: .
      args:
        MODULE: server-game
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-pangya}
      DATABASE_USER: ${POSTGRES_USER:-pangya}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
      REDIS_URI: redis://host.docker.internal:6379
      PANGYA_AUTH_HOST: host.docker.internal
      PANGYA_IP: ${PANGYA_IP:-127.0.0.1}
    ports:
      - "0.0.0.0:20202:20202"
      - "0.0.0.0:9202:9202"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9202/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  ranking:
    build:
      context: .
      args:
        MODULE: server-ranking
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-pangya}
      DATABASE_USER: ${POSTGRES_USER:-pangya}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
      REDIS_URI: redis://host.docker.internal:6379
      PANGYA_AUTH_HOST: host.docker.internal
      PANGYA_IP: ${PANGYA_IP:-127.0.0.1}
    ports:
      - "0.0.0.0:4774:4774"
      - "0.0.0.0:9474:9474"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9474/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  messenger:
    build:
      context: .
      args:
        MODULE: server-messenger
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-pangya}
      DATABASE_USER: ${POSTGRES_USER:-pangya}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pangya}
      REDIS_URI: redis://host.docker.internal:6379
      PANGYA_AUTH_HOST: host.docker.internal
      PANGYA_IP: ${PANGYA_IP:-127.0.0.1}
    ports:
      - "0.0.0.0:30201:30201"
      - "0.0.0.0:9302:9302"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9302/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

volumes:
  pangya-pg:
